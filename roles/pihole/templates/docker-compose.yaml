version: "3"

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:{{ pihole_docker_version }}
    network_mode: host
    dns:
      - 127.0.0.1
      - 1.1.1.1
    environment:
      {{ pihole_default_environment | combine(pihole_environment) | to_nice_yaml | indent(width=6)}}
    volumes:
      - './etc/pihole:/etc/pihole'
    restart: unless-stopped

  dnscrypt:
    container_name: dnscrypt-proxy
    network_mode: host
    image: klutchell/dnscrypt-proxy:{{ pihole_dnscrypt_docker_version }}
    restart: unless-stopped
    environment:
      TZ: '{{ (pihole_default_environment | combine(pihole_environment))["TZ"] }}'
    volumes:
      - './etc/dnscrypt-proxy/dnscrypt-proxy.toml:/config/dnscrypt-proxy.toml'

{% if priority == 100 %}
  nebula-sync:
    container_name: nebula-sync
    image: ghcr.io/lovelaze/nebula-sync:{{ pihole_nebula_sync_docker_version }}
    restart: unless-stopped
    user: '{{ ansible_user_uid }}:{{ ansible_user_gid }}'
    secrets:
      - nebula_primary
      - nebula_replicas
    environment:
      TZ: '{{ (pihole_default_environment | combine(pihole_environment))["TZ"] }}'
      PRIMARY_FILE: /run/secrets/nebula_primary
      REPLICAS_FILE: /run/secrets/nebula_replicas
      FULL_SYNC: '{{ pihole_nebula_sync_full_sync | string }}'
      RUN_GRAVITY: '{{ pihole_nebula_sync_run_gravity | string }}'
      CRON: '{{ pihole_nebula_sync_cron }}'
      {{ pihole_nebula_sync_selective | to_nice_yaml | indent(width=6) }}
secrets:
  nebula_primary:
    file: './secrets/nebula-primary.txt'
  nebula_replicas:
    file: './secrets/nebula-replicas.txt'
{% endif %}