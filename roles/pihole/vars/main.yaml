pihole_default_environment:
  TZ: 'Europe/Paris'
  FTLCONF_dns_reply_host_IPv4: "{{ pihole_vip_ipv4.split('/')[0] }}"
  FTLCONF_dns_reply_host_IPv6: "{{ pihole_vip_ipv6.split('/')[0] }}"
  FTLCONF_dns_reply_host_force4: 'true'
  FTLCONF_dns_reply_host_force6: 'true'
  FTLCONF_dns_upstreams: "127.0.0.1#{{ pihole_dnscrypt_port|string + pihole_dnscrypt_ipv6|bool|ternary(';::1#'+pihole_dnscrypt_port|string,'') }}"
  FTLCONF_dns_interface: '{{ ansible_facts.default_ipv4.interface }}'
  FTLCONF_webserver_api_password: '{{ pihole_api_password }}'
  PIHOLE_UID: '{{ ansible_facts.user_uid }}'
  PIHOLE_GID: '{{ ansible_facts.user_gid }}'
